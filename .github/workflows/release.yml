name: Build and Release

on:
  push:
    branches: [ "main", "master" ]

# Даем права на создание релиза
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release

    # Переименовываем файлы, чтобы в релизе они не путались и не перезаписывали друг друга
    - name: Rename Linux binary
      if: runner.os == 'Linux'
      run: mv build/lab4 build/lab4-linux

    - name: Rename Windows binary
      if: runner.os == 'Windows'
      run: mv build/Release/lab4.exe build/lab4-windows.exe

    # Создаем сам релиз и прикрепляем файлы
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        # Автоматически генерируем тег на основе номера запуска (v1.0.1, v1.0.2 и т.д.)
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          build/lab4-linux
          build/lab4-windows.exe